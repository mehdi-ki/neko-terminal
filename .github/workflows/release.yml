name: Build & Release

# Push a tag like v1.2.0 to build Windows, macOS and Linux and publish a GitHub release.
# "Run workflow" (manual) only builds and keeps the files as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: node-pty prebuilds for both Mac architectures
        if: runner.os == 'macOS'
        run: node scripts/fetch-pty-prebuilds.js darwin-arm64 darwin-x64
      - name: Build
        env:
          NEKO_RELEASE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:release -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
